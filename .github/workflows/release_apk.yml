name: 发布 APK 到 Release

# 与 KiTerminal-UX 的 release_apk.yml 同一套骨架：
# 预检 → 构建 → 汇总上传，签名私钥与口令完全同款。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加 APK 的 Release tag"
        required: true
        type: string

# 产物包专用的 Release（prebuilts-*）不是发版，别给它打 APK。
# 预检作业直接跳过，后面的 build / publish 因 needs 不满足也不会跑。
concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 1. 预检：Release 里是否已经有 APK ─────────────────────────────
  preflight:
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'prebuilts') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 检查 Release 是否已附带 APK
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::error::无法确定 tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          assets=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            | jq -r '.assets[]?.name' 2>/dev/null | grep -i '\.apk$' || true)
          if [ -n "$assets" ]; then
            echo "Release 已有 APK："
            echo "$assets"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 构建签名 Release APK ───────────────────────────────────────
  build:
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 仅本作业可见的签名材料
      KI_TERMINAL_STORE_PASSWORD: ${{ secrets.KI_TERMINAL_STORE_PASSWORD }}
      KI_TERMINAL_KEY_PASSWORD: ${{ secrets.KI_TERMINAL_KEY_PASSWORD }}
      KI_TERMINAL_KEY_ALIAS: ${{ secrets.KI_TERMINAL_KEY_ALIAS }}
      JKS_BASE64: ${{ secrets.JKS_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 恢复 ArkUI-X 预编译产物
        uses: ./.github/actions/prepare-arkui-x
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prebuilt-url: ${{ vars.HOA_PREBUILT_URL }}

      - name: 解码签名私钥（与 KiTerminal-UX 同款 JKS）
        env:
          JKS_BASE64: ${{ secrets.JKS_BASE64 }}
        run: |
          if [ -n "$JKS_BASE64" ]; then
            echo "$JKS_BASE64" | base64 -d > app/ki-terminal-release.jks
            echo "JKS 写入完成：$(stat -c%s app/ki-terminal-release.jks) 字节"
          elif [ -s app/ki-terminal-release.jks ]; then
            echo "使用仓库内已有的 ki-terminal-release.jks"
          else
            echo "::error::缺少私钥：请在 Secrets 里配置 JKS_BASE64（与 KiTerminal-UX 同一份 keystore）"
            exit 1
          fi

      - name: 校验签名材料
        run: |
          test -s app/ki-terminal-release.jks || { echo "::error::仓库内缺少 ki-terminal-release.jks"; exit 1; }
          test -n "$KI_TERMINAL_STORE_PASSWORD" || { echo "::error::缺少 Secrets.KI_TERMINAL_STORE_PASSWORD"; exit 1; }
          test -n "$KI_TERMINAL_KEY_PASSWORD" || { echo "::error::缺少 Secrets.KI_TERMINAL_KEY_PASSWORD"; exit 1; }

      - name: 编译 Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 核验签名
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs "$apk"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: hoa-release
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

  # ── 3. 汇总上传到 Release ─────────────────────────────────────────
  publish:
    needs: [preflight, build]
    if: always() && needs.preflight.outputs.skip == 'false' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 上传 APK 到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          upload_base=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            | jq -r '.upload_url' | sed 's/{?name,label}//')
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::dist/ 下没有 APK"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            echo "上传 $name"
            curl -sS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$apk" \
              "$upload_base?name=$name" | jq -r '.state // .message'
          done
